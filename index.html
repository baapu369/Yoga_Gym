<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProFit Elite v8.3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root { --bg: #000000; --card: #151515; --accent: #38bdf8; --hiit: #4ade80; --muscle: #a855f7; --gym: #fbbf24; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: var(--bg); width: 100%; max-width: 420px; display: flex; flex-direction: column; }
        
        /* Main Menu */
        h1 { font-size: 32px; margin: 20px 0; font-weight: 900; }
        .menu-item { background: #1c1c1c; border-radius: 20px; padding: 25px; margin-bottom: 15px; cursor: pointer; border: 1px solid transparent; }
        .menu-item h3 { margin: 0; font-size: 18px; color: white; }
        .menu-item p { margin: 5px 0 0; font-size: 13px; color: #777; }

        /* Settings UI */
        .header-row { display: flex; align-items: center; margin-bottom: 30px; }
        .back-arrow { font-size: 24px; cursor: pointer; margin-right: 20px; color: white; text-decoration: none; }
        .screen-title { font-size: 16px; font-weight: 800; text-transform: uppercase; }
        .input-row { margin-bottom: 25px; border-bottom: 1px solid #1a1a1a; padding-bottom: 10px; }
        .input-row label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: white; }
        select, input { background: transparent; border: none; color: #888; width: 100%; font-size: 15px; outline: none; }

        /* Builder Cards */
        .ex-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 3px solid var(--accent); position: relative; }
        .drag-handle { position: absolute; left: 0; top: 0; bottom: 0; width: 36px; display: flex; align-items: center; justify-content: center; cursor: grab; color: #555; font-size: 18px; user-select: none; touch-action: none; border-radius: 12px 0 0 12px; }
        .drag-handle:active { cursor: grabbing; color: var(--accent); }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 10px; }
        .grid-item label { font-size: 12px; color: white; font-weight: 600; }

        /* Timer UI */
        #total-clock { color: var(--gym); font-size: 12px; font-weight: 900; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }
        .big-go { font-size: 110px; font-weight: 900; text-align: center; margin: 20px 0; }
        .set-indicator { color: #4ade80; font-size: 14px; font-weight: 800; text-transform: uppercase; text-align: center; }
        .tap-finish { border: 2px dashed #444; border-radius: 20px; padding: 25px; margin: 20px 0; cursor: pointer; text-align: center; }
        .tap-finish span { color: #fbbf24; font-weight: 800; font-size: 14px; }

        /* Separate Buttons */
        .btn-green { background: #4ade80; color: black; border-radius: 20px; padding: 18px; font-weight: 800; border: none; width: 100%; cursor: pointer; text-transform: uppercase; margin-bottom: 12px; }
        .btn-blue { background: #38bdf8; color: black; border-radius: 20px; padding: 18px; font-weight: 800; border: none; width: 100%; cursor: pointer; text-transform: uppercase; }

        .action-row { display: flex; gap: 12px; margin: 15px 0; }
        .action-row button { flex: 1; border-radius: 20px; padding: 16px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; font-size: 14px; }
        .btn-pause { background: #fbbf24; color: black; }
        .btn-skip { background: #38bdf8; color: black; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container" id="menu-screen">
    <h1>ProFit <span style="color:#38bdf8">Elite</span></h1>
    <div onclick="showScreen('builder-screen')" class="menu-item"><h3>1. Make My Own Routine</h3><p>Custom list with unique times</p></div>
    <div onclick="showScreen('hiit-screen')" class="menu-item"><h3>2. HIIT / Gym Mode</h3><p>Standard repeating intervals</p></div>
    <div onclick="showScreen('muscle-screen')" class="menu-item"><h3>3. Muscle Rest Timer</h3><p>Scientific recovery</p></div>
</div>

<div class="container hidden" id="builder-screen">
    <div class="header-row"><a class="back-arrow" onclick="showScreen('menu-screen')">←</a><div class="screen-title">BUILDER</div></div>

    <!-- Routine selector -->
    <div style="margin-bottom: 15px;">
        <label style="font-size: 12px; font-weight: 700; color: #777; text-transform: uppercase;">Current Routine</label>
        <div style="display: flex; gap: 8px; margin-top: 6px; align-items: center;">
            <select id="routine-select" onchange="switchRoutine()" style="flex: 1; background: #1c1c1c; border: 1px solid #333; border-radius: 10px; color: white; padding: 10px; font-size: 14px;"></select>
            <button onclick="newRoutinePrompt()" style="background: #4ade80; color: black; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 800; cursor: pointer; font-size: 16px;" title="New routine">+</button>
            <button onclick="renameRoutinePrompt()" style="background: #fbbf24; color: black; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 800; cursor: pointer; font-size: 13px;" title="Rename routine">✎</button>
            <button onclick="deleteRoutinePrompt()" style="background: #ef4444; color: white; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 800; cursor: pointer; font-size: 13px;" title="Delete routine">✕</button>
        </div>
    </div>

    <div id="builder-list"></div>
    <div class="tap-finish" style="padding: 10px; border-style: dotted; margin-bottom: 15px;" onclick="addExRow()"><span>+ ADD EXERCISE</span></div>

    <!-- Google Sheets Import -->
    <div style="margin-bottom: 15px;">
        <button onclick="toggleSheetsImport()" style="background: #1c1c1c; color: #38bdf8; border: 1px solid #333; border-radius: 12px; padding: 12px; width: 100%; font-weight: 700; cursor: pointer; font-size: 13px; text-transform: uppercase;">📋 Import from Google Sheets / CSV</button>
        <div id="sheets-import-panel" class="hidden" style="margin-top: 10px; background: #1c1c1c; border-radius: 12px; padding: 15px; border: 1px solid #333;">
            <label style="font-size: 12px; font-weight: 700; color: #777; display: block; margin-bottom: 6px;">Paste CSV rows (exercise_name, workout_time, rest_time, rounds)</label>
            <textarea id="csv-input" rows="5" placeholder="Push Ups, 30, 15, 3&#10;Squats, 40, 20, 2&#10;Plank, 60, 10, 1" style="width: 100%; background: #0a0a0a; color: white; border: 1px solid #333; border-radius: 8px; padding: 10px; font-size: 13px; font-family: monospace; resize: vertical; box-sizing: border-box;"></textarea>
            <div style="margin-top: 8px; margin-bottom: 8px;">
                <label style="font-size: 12px; font-weight: 700; color: #777; display: block; margin-bottom: 6px;">Or paste a published Google Sheets CSV URL</label>
                <input id="sheets-url" type="url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv" style="width: 100%; background: #0a0a0a; color: white; border: 1px solid #333; border-radius: 8px; padding: 10px; font-size: 13px; box-sizing: border-box;">
            </div>
            <div style="display: flex; gap: 8px;">
                <button onclick="importCSV()" style="flex: 1; background: #4ade80; color: black; border: none; border-radius: 10px; padding: 10px; font-weight: 800; cursor: pointer; font-size: 13px;">IMPORT CSV TEXT</button>
                <button onclick="importFromSheetsURL()" style="flex: 1; background: #38bdf8; color: black; border: none; border-radius: 10px; padding: 10px; font-weight: 800; cursor: pointer; font-size: 13px;">FETCH FROM URL</button>
            </div>
        </div>
    </div>

    <button class="btn-green" onclick="saveCurrentRoutine()">SAVE ROUTINE</button>
    <button class="btn-blue" onclick="startWorkout('builder')">START WORKOUT</button>
</div>

<div class="container hidden" id="muscle-screen">
    <div class="header-row"><a class="back-arrow" onclick="showScreen('menu-screen')">←</a><div class="screen-title">MUSCLE TIMER</div></div>
    <div class="input-row"><label>Training type</label><select id="m-type"><option>Hypertrophy - Size & Strength</option><option>Exhaust - Lean Muscle & Burn</option></select></div>
    <div class="input-row"><label>Muscle</label><select id="m-muscle"><option>Chest</option><option>Back</option><option>Shoulder</option><option>Biceps</option><option>Triceps</option><option>Lower Body</option><option>Abs</option></select></div>
    <div class="input-row"><label>Rep Range</label><select id="m-reps"><option>1 - 6 Reps to Failure</option><option>6 - 10 Reps to Failure</option><option>10 - 15 Reps to Failure</option><option>15 - 20 Reps to Failure</option></select></div>
    <div class="input-row"><label>Sets</label><input type="number" id="m-sets" value="4"></div>
    <button class="btn-blue" onclick="startWorkout('muscle')">START SESSION</button>
</div>

<div class="container hidden" id="hiit-screen">
    <div class="header-row"><a class="back-arrow" onclick="showScreen('menu-screen')">←</a><div class="screen-title">HIIT SETTINGS</div></div>
    <div class="input-row"><label>Work Duration (s)</label><input type="number" id="h-work" value="40"></div>
    <div class="input-row"><label>Rest Duration (s)</label><input type="number" id="h-rest" value="20"></div>
    <div class="input-row"><label>Exercises</label><input type="number" id="h-ex" value="8"></div>
    <div class="input-row"><label>Rounds</label><input type="number" id="h-rounds" value="1"></div>
    <button class="btn-blue" onclick="startWorkout('hiit')">START HIIT</button>
</div>

<div class="container hidden" id="timer-active" style="padding-top: 30px;">
    <div id="total-clock">TOTAL TIME LEFT: 00:00</div>
    <div class="set-indicator" id="set-num">SET 1</div>
    <div class="big-go" id="display">GO</div>
    <div id="ex-display" style="color: #555; font-size: 14px; margin-bottom: 20px; text-align: center;">EXERCISE</div>
    <div class="tap-finish" id="manual-trigger"><span>TAP WHEN SET FINISHED</span></div>
    <div class="action-row">
        <button class="btn-pause" id="pause-btn" onclick="togglePause()">PAUSE</button>
        <button class="btn-skip" onclick="skipExercise()">SKIP</button>
    </div>
    <div style="text-align: center;">
        <button style="color:#ef4444; background:none; border:none; margin-top:20px; cursor:pointer; text-transform: uppercase; font-weight: 800; font-size: 12px;" onclick="location.reload()">QUIT SESSION</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const SKIP_WAIT_SECONDS = 5; // Default wait timer when skip button is pressed
    let queue = [], qIdx = 0, timeLeft = 0, totalTimeSec = 0, timer = null, paused = false;
    let routines = JSON.parse(localStorage.getItem('profit_v8_save') || '{}');
    let activeRoutineName = localStorage.getItem('profit_v8_active') || '';

    // Migration: if old format had "My Routine" key, keep it; ensure at least one routine exists
    if(Object.keys(routines).length === 0) { routines["My Routine"] = []; activeRoutineName = "My Routine"; }
    if(!activeRoutineName || !routines[activeRoutineName]) activeRoutineName = Object.keys(routines)[0];

    Sortable.create(document.getElementById('builder-list'), { animation: 150, handle: '.drag-handle' });

    function showScreen(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'builder-screen') loadBuilder();
    }

    /* ---- Routine Management ---- */
    function populateRoutineSelect() {
        const sel = document.getElementById('routine-select');
        sel.innerHTML = '';
        Object.keys(routines).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            if(name === activeRoutineName) opt.selected = true;
            sel.appendChild(opt);
        });
    }

    function switchRoutine() {
        activeRoutineName = document.getElementById('routine-select').value;
        localStorage.setItem('profit_v8_active', activeRoutineName);
        loadBuilder();
    }

    function newRoutinePrompt() {
        const name = prompt("Enter a name for the new routine:");
        if(!name || !name.trim()) return;
        const trimmed = name.trim();
        if(routines[trimmed]) { alert("A routine with that name already exists."); return; }
        routines[trimmed] = [];
        activeRoutineName = trimmed;
        localStorage.setItem('profit_v8_save', JSON.stringify(routines));
        localStorage.setItem('profit_v8_active', activeRoutineName);
        loadBuilder();
    }

    function renameRoutinePrompt() {
        const newName = prompt("Rename routine to:", activeRoutineName);
        if(!newName || !newName.trim() || newName.trim() === activeRoutineName) return;
        const trimmed = newName.trim();
        if(routines[trimmed]) { alert("A routine with that name already exists."); return; }
        routines[trimmed] = routines[activeRoutineName];
        delete routines[activeRoutineName];
        activeRoutineName = trimmed;
        localStorage.setItem('profit_v8_save', JSON.stringify(routines));
        localStorage.setItem('profit_v8_active', activeRoutineName);
        loadBuilder();
    }

    function deleteRoutinePrompt() {
        if(Object.keys(routines).length <= 1) { alert("Cannot delete the only routine."); return; }
        if(!confirm(`Delete "${activeRoutineName}"?`)) return;
        delete routines[activeRoutineName];
        activeRoutineName = Object.keys(routines)[0];
        localStorage.setItem('profit_v8_save', JSON.stringify(routines));
        localStorage.setItem('profit_v8_active', activeRoutineName);
        loadBuilder();
    }

    /* ---- Builder ---- */
    function addExRow(data = null) {
        const div = document.createElement('div');
        div.className = 'ex-card';
        div.innerHTML = `<div class="drag-handle">⠿</div><span onclick="this.parentElement.remove()" style="position:absolute; right:15px; top:15px; color:#ef4444; cursor:pointer; font-size: 20px;">✕</span>
            <input type="text" class="name-in" placeholder="Exercise Name" value="${data?data.n:''}" style="background:transparent; border:none; border-bottom:1px solid #333; color:white; font-size:16px; width:80%; margin-left:22px;">
            <div class="card-grid" style="margin-left:22px;">
                <div class="grid-item"><label>Work(s)</label><input type="number" class="w-in" value="${data?data.w:30}"></div>
                <div class="grid-item"><label>Rest(s)</label><input type="number" class="r-in" value="${data?data.r:15}"></div>
                <div class="grid-item"><label>Round</label><input type="number" class="rd-in" value="${data?data.rd:1}"></div>
            </div>`;
        document.getElementById('builder-list').appendChild(div);
    }

    function loadBuilder() {
        populateRoutineSelect();
        const list = document.getElementById('builder-list');
        list.innerHTML = '';
        (routines[activeRoutineName] || []).forEach(d => addExRow(d));
        if(!list.children.length) addExRow();
    }

    function saveCurrentRoutine() {
        const cards = [...document.querySelectorAll('.ex-card')];
        routines[activeRoutineName] = cards.map(c => ({
            n: c.querySelector('.name-in').value, w: c.querySelector('.w-in').value, r: c.querySelector('.r-in').value, rd: c.querySelector('.rd-in').value
        }));
        localStorage.setItem('profit_v8_save', JSON.stringify(routines));
        localStorage.setItem('profit_v8_active', activeRoutineName);
        alert("Routine Saved!");
    }

    /* ---- Google Sheets / CSV Import ---- */
    function toggleSheetsImport() {
        document.getElementById('sheets-import-panel').classList.toggle('hidden');
    }

    function parseCSVRows(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const exercises = [];
        for(const line of lines) {
            const parts = line.split(',').map(p => p.trim());
            if(parts.length < 1) continue;
            // Skip header rows that look like labels
            if(parts[0].toLowerCase() === 'exercise_name' || parts[0].toLowerCase() === 'exercise' || parts[0].toLowerCase() === 'name') continue;
            const name = parts[0] || '';
            const workTime = parseInt(parts[1]) || 30;
            const restTime = parseInt(parts[2]) || 15;
            const rounds = parseInt(parts[3]) || 1;
            exercises.push({ n: name, w: workTime, r: restTime, rd: rounds });
        }
        return exercises;
    }

    function importCSV() {
        const text = document.getElementById('csv-input').value.trim();
        if(!text) { alert("Please paste CSV data first."); return; }
        const exercises = parseCSVRows(text);
        if(exercises.length === 0) { alert("No valid exercises found in the CSV data."); return; }
        // Add to current routine
        exercises.forEach(ex => addExRow(ex));
        document.getElementById('csv-input').value = '';
        alert(`Imported ${exercises.length} exercise(s). Don't forget to save!`);
    }

    function importFromSheetsURL() {
        const url = document.getElementById('sheets-url').value.trim();
        if(!url) { alert("Please enter a Google Sheets published CSV URL."); return; }
        // Ensure URL ends with output=csv for published sheets
        fetch(url)
            .then(res => {
                if(!res.ok) throw new Error('Failed to fetch. Make sure the sheet is published to web as CSV.');
                return res.text();
            })
            .then(text => {
                const exercises = parseCSVRows(text);
                if(exercises.length === 0) { alert("No valid exercises found in the fetched data."); return; }
                exercises.forEach(ex => addExRow(ex));
                document.getElementById('sheets-url').value = '';
                alert(`Imported ${exercises.length} exercise(s) from URL. Don't forget to save!`);
            })
            .catch(err => alert("Error fetching sheet: " + err.message));
    }

    function speak(t) { synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-IN'; u.rate = 0.95; synth.speak(u); }

    function startWorkout(mode) {
        queue = []; totalTimeSec = 0;
        if(mode === 'builder') {
            const cards = [...document.querySelectorAll('.ex-card')];
            cards.forEach((c, idx) => {
                const n = c.querySelector('.name-in').value || `Exercise ${idx+1}`;
                const w = parseInt(c.querySelector('.w-in').value), r = parseInt(c.querySelector('.r-in').value), rd = parseInt(c.querySelector('.rd-in').value);
                for(let i=1; i<=rd; i++) {
                    if(idx === 0 && i === 1) { queue.push({ d: n, s: `PREPARE`, v: `We will start ${n} now`, t: 5 }); totalTimeSec += 5; }
                    queue.push({ d: n, s: `SET ${i}`, v: `Go!`, t: w }); totalTimeSec += w;
                    let next = (i < rd) ? `${n} Set ${i+1}` : (cards[idx+1] ? cards[idx+1].querySelector('.name-in').value : "Workout complete");
                    queue.push({ d: "REST", s: `REST`, v: `Set over. Next is ${next}. Take rest.`, t: r }); totalTimeSec += r;
                }
            });
        } else if(mode === 'hiit') {
            const w = parseInt(document.getElementById('h-work').value), r = parseInt(document.getElementById('h-rest').value), ex = parseInt(document.getElementById('h-ex').value), rds = parseInt(document.getElementById('h-rounds').value);
            for(let j=1; j<=rds; j++) {
                for(let i=1; i<=ex; i++) {
                    if(j===1 && i===1) { queue.push({ d: `Exercise 1`, s: `PREPARE`, v: `Starting HIIT workout now`, t: 5 }); totalTimeSec += 5; }
                    queue.push({ d: `Exercise ${i}`, s: `ROUND ${j}`, v: `Go!`, t: w }); totalTimeSec += w;
                    let next = (i < ex) ? `Exercise ${i+1}` : (j < rds ? `Round ${j+1}` : "Done");
                    queue.push({ d: "REST", s: `REST`, v: `Next is ${next}. Rest.`, t: r }); totalTimeSec += r;
                }
            }
        } else if(mode === 'muscle') {
            const sets = parseInt(document.getElementById('m-sets').value), m = document.getElementById('m-muscle').value;
            for(let i=1; i<=sets; i++) {
                if(i === 1) { queue.push({ d: m, s: `PREPARE`, v: `We will start ${m} now`, t: 5 }); totalTimeSec += 5; }
                queue.push({ d: m, s: `SET ${i}`, v: `Go!`, t: 0 });
                queue.push({ d: "REST", s: `REST`, v: (i<sets)?`Next set in 90 seconds.`:`Workout finished.`, t: 90 }); totalTimeSec += 90;
            }
        }
        runEngine();
    }

    function updateTotalClock() {
        const min = Math.floor(totalTimeSec / 60);
        const sec = totalTimeSec % 60;
        document.getElementById('total-clock').innerText = `TOTAL TIME LEFT: ${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function advanceQueue() {
        qIdx++;
        if(qIdx < queue.length) {
            const cur = queue[qIdx];
            document.getElementById('set-num').innerText = cur.s;
            document.getElementById('ex-display').innerText = cur.d;
            speak(cur.v);
            if(cur.t === 0) {
                document.getElementById('display').innerText = "GO";
                document.getElementById('manual-trigger').onclick = () => { timeLeft = 0; };
            } else { timeLeft = cur.t; }
            updateTotalClock();
        } else {
            clearInterval(timer);
            document.getElementById('total-clock').innerText = "WORKOUT COMPLETE";
            speak("Workout complete.");
            setTimeout(() => location.reload(), 2000);
        }
    }

    function timerTick() {
        if(timeLeft > 0) {
            document.getElementById('display').innerText = timeLeft;
            if(timeLeft <= 3) speak(timeLeft);
            timeLeft--;
            if(totalTimeSec > 0) totalTimeSec--;
            updateTotalClock();
        } else {
            advanceQueue();
        }
    }

    function runEngine() {
        showScreen('timer-active');
        qIdx = 0; timeLeft = queue[0].t;
        paused = false;
        document.getElementById('pause-btn').innerText = 'PAUSE';
        updateTotalClock();
        speak(queue[0].v);
        if(timer) clearInterval(timer);
        timer = setInterval(timerTick, 1000);
    }

    function togglePause() {
        if(paused) {
            paused = false;
            timer = setInterval(timerTick, 1000);
            document.getElementById('pause-btn').innerText = 'PAUSE';
        } else {
            paused = true;
            clearInterval(timer);
            timer = null;
            document.getElementById('pause-btn').innerText = 'RESUME';
            synth.cancel();
        }
    }

    function skipExercise() {
        // Find the current exercise name (look backward for a non-REST item)
        let currentExName = '';
        for(let i = qIdx; i >= 0; i--) {
            if(queue[i].d !== 'REST') { currentExName = queue[i].d; break; }
        }

        // Subtract remaining time of the current item
        totalTimeSec -= timeLeft;

        // Advance past all items belonging to the current exercise
        let nextIdx = qIdx + 1;
        while(nextIdx < queue.length) {
            if(queue[nextIdx].d !== 'REST' && queue[nextIdx].d !== currentExName) break;
            totalTimeSec -= queue[nextIdx].t;
            nextIdx++;
        }

        if(totalTimeSec < 0) totalTimeSec = 0;

        if(nextIdx < queue.length) {
            // Insert a preparation step before the next exercise
            const nextExName = queue[nextIdx].d;
            const prepItem = { d: nextExName, s: 'PREPARE', v: `Next exercise is ${nextExName}. Get ready.`, t: SKIP_WAIT_SECONDS };

            // Insert the prep item into the queue and adjust total time
            queue.splice(nextIdx, 0, prepItem);
            totalTimeSec += SKIP_WAIT_SECONDS;

            // Jump to the newly inserted prep item
            qIdx = nextIdx;
            const cur = queue[qIdx];
            timeLeft = cur.t;
            document.getElementById('set-num').innerText = cur.s;
            document.getElementById('ex-display').innerText = cur.d;
            document.getElementById('display').innerText = cur.t;
            speak(cur.v);
            updateTotalClock();

            // If paused, resume the timer
            if(paused) {
                paused = false;
                timer = setInterval(timerTick, 1000);
                document.getElementById('pause-btn').innerText = 'PAUSE';
            }
        } else {
            clearInterval(timer);
            document.getElementById('total-clock').innerText = "WORKOUT COMPLETE";
            speak("Workout complete.");
            setTimeout(() => location.reload(), 2000);
        }
    }
</script>
</body>
</html>
